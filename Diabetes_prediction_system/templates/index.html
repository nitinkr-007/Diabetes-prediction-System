<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HealthNexus AI</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;

            font-family: 'Open Sans', Arial, sans-serif;

            background: linear-gradient(135deg, #092756, #1b4f72);

            color: white;

            padding: 25px 30px;
        }

        /* =========================
           TOP NAVIGATION
        ========================= */

        .top-bar {
            width: 100%;

            display: flex;
            justify-content: space-between;
            align-items: center;

            margin-bottom: 25px;
        }

        /* HealthNexus AI Logo */

        .brand {
            display: flex;
            align-items: center;

            text-decoration: none;

            color: white;
        }

        .brand img {
            width: 60px;
            height: 60px;

            object-fit: contain;

            margin-right: 10px;
        }

        .brand-name {
            font-size: 22px;
            font-weight: 700;

            letter-spacing: 0.5px;
        }

        /* About Us */

        .about-link {
            color: white;

            text-decoration: none;

            font-size: 16px;

            font-weight: 500;

            padding: 10px 15px;

            border-radius: 6px;

            transition: 0.3s;
        }

        .about-link:hover {
            background: rgba(255, 255, 255, 0.15);

            color: #5dade2;
        }


        /* =========================
           MAIN FORM CONTAINER
        ========================= */

        .login {
            width: 100%;

            max-width: 500px;

            margin: 30px auto;

            padding: 35px;

            background: rgba(0, 0, 0, 0.25);

            border-radius: 15px;

            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.35);

            backdrop-filter: blur(8px);
        }


        /* =========================
           HEADING
        ========================= */

        .login h1 {
            text-align: center;

            font-size: 30px;

            margin-bottom: 30px;

            font-weight: 600;
        }


        /* =========================
           LABELS
        ========================= */

        .input-group {
            margin-bottom: 18px;
        }

        .input-group label {
            display: block;

            margin-bottom: 7px;

            font-size: 14px;

            font-weight: 600;

            color: rgba(255, 255, 255, 0.9);
        }


        /* =========================
           INPUT BOXES
        ========================= */

        .form-input {
            width: 100%;

            height: 48px;

            padding: 0 15px;

            background: rgba(255, 255, 255, 0.12);

            border: 1px solid rgba(255, 255, 255, 0.25);

            border-radius: 7px;

            color: white;

            font-size: 15px;

            outline: none;

            transition: 0.3s;
        }

        .form-input:focus {
            border-color: #5dade2;

            background: rgba(255, 255, 255, 0.18);

            box-shadow: 0 0 8px rgba(93, 173, 226, 0.5);
        }


        /* =========================
           PREDICT BUTTON
        ========================= */

        .btn {
            border: none;

            cursor: pointer;

            transition: 0.3s;
        }

        .btn-primary {
            width: 100%;

            height: 50px;

            margin-top: 10px;

            background: linear-gradient(
                135deg,
                #4a77d4,
                #2563c7
            );

            color: white;

            border-radius: 7px;

            font-size: 17px;

            font-weight: bold;

            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.25);
        }

        .btn-primary:hover {
            background: linear-gradient(
                135deg,
                #5b8de3,
                #3474d6
            );

            transform: translateY(-2px);
        }

        .btn-primary:active {
            transform: translateY(0);
        }


        /* =========================
           MOBILE RESPONSIVE
        ========================= */

        @media (max-width: 600px) {

            body {
                padding: 18px 15px;
            }

            .top-bar {
                margin-bottom: 15px;
            }

            .brand img {
                width: 38px;
                height: 38px;
            }

            .brand-name {
                font-size: 18px;
            }

            .about-link {
                font-size: 14px;
            }

            .login {
                padding: 25px 20px;

                margin-top: 20px;
            }

            .login h1 {
                font-size: 25px;
            }
        }
    </style>

</head>


<body>


    <!-- =========================
         TOP BAR
    ========================== -->

    <div class="top-bar">

        <!-- HealthNexus AI -->

        <a href="/" class="brand">

            <!-- Put your PNG logo inside static folder -->
            <img
                src="{{ url_for('static', filename='healthnexus-logo.png') }}"
                alt="HealthNexus AI Logo"
            >

            <span class="brand-name">
                HealthNexus AI
            </span>

        </a>


        <!-- About Us -->

        <a href="{{ url_for('about') }}" class="about-link">
            About Us
        </a>

    </div>



    <!-- =========================
         INPUT FORM
    ========================== -->

    <div class="login">

        <h1>Input Symptoms</h1>


        <form
            action="{{ url_for('predict') }}"
            method="post"
        >


            <!-- Pregnancies -->

            <div class="input-group">

                <label for="pregnancies">
                    Number of Pregnancies
                </label>

                <input
                    type="text"
                    id="pregnancies"
                    name="pregnancies"
                    class="form-input"
                    required
                >

            </div>



            <!-- Glucose -->

            <div class="input-group">

                <label for="glucose">
                    Glucose (mg/dL)
                </label>

                <input
                    type="text"
                    id="glucose"
                    name="glucose"
                    class="form-input"
                    required
                >

            </div>



            <!-- Blood Pressure -->

            <div class="input-group">

                <label for="bloodpressure">
                    Blood Pressure (mmHg)
                </label>

                <input
                    type="text"
                    id="bloodpressure"
                    name="bloodpressure"
                    class="form-input"
                    required
                >

            </div>



            <!-- Skin Thickness -->

            <div class="input-group">

                <label for="skinthickness">
                    Skin Thickness (mm)
                </label>

                <input
                    type="text"
                    id="skinthickness"
                    name="skinthickness"
                    class="form-input"
                    required
                >

            </div>



            <!-- Insulin -->

            <div class="input-group">

                <label for="insulin">
                    Insulin Level (IU/mL)
                </label>

                <input
                    type="text"
                    id="insulin"
                    name="insulin"
                    class="form-input"
                    required
                >

            </div>



            <!-- BMI -->

            <div class="input-group">

                <label for="bmi">
                    Body Mass Index (BMI)
                </label>

                <input
                    type="text"
                    id="bmi"
                    name="bmi"
                    class="form-input"
                    required
                >

            </div>



            <!-- Diabetes Pedigree Function -->

            <div class="input-group">

                <label for="dpf">
                    Diabetes Pedigree Function
                </label>

                <input
                    type="text"
                    id="dpf"
                    name="dpf"
                    class="form-input"
                    required
                >

            </div>



            <!-- Age -->

            <div class="input-group">

                <label for="age">
                    Age (years)
                </label>

                <input
                    type="text"
                    id="age"
                    name="age"
                    class="form-input"
                    required
                >

            </div>



            <!-- Predict Button -->

            <button
                type="submit"
                class="btn btn-primary"
            >
                Check
            </button>


        </form>

    </div>


</body>

</html>
